spring:
  application:
    name: ${SERVICE_NAME:seat-inventory-service}

server:
  port: ${PORT:8084}

seat-hold:
  ttl: ${SEAT_HOLD_TTL:PT5M}
  sweep-interval: ${SEAT_HOLD_SWEEP_INTERVAL:PT5S}
  sweep-enabled: ${SEAT_HOLD_SWEEP_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    root: INFO
    '[org.springframework]': INFO
    '[com.example]': DEBUG
