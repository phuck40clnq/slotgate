spring:
  datasource:
    url: jdbc:postgresql://staging-db-server:5432/${DB_NAME:myapp_db}
    username: ${DB_USER:dev}
    password: ${DB_PASS:dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        '[format_sql]': true